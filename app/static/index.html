<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Initium</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f4f1e8 0%, #e6edf7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #1f2937;
    }

    main {
      background: rgba(255, 255, 255, 0.82);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      width: min(560px, calc(100vw - 32px));
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      color: #4b5563;
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      padding: 12px 18px;
      background-color: #1f2937;
      border: none;
      color: white;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .button.secondary {
      background-color: #dbe4f0;
      color: #1f2937;
    }

    .button:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main>
    <h1>Terra Initium</h1>
    <p>This container serves multiple frontend modules from one FastAPI backend.</p>
    <div class="links">
      <a class="button" href="/interview_questions">Interview Questions</a>
      <a class="button secondary" href="/openlens">OpenLens</a>
    </div>
  </main>
</body>
</html>
